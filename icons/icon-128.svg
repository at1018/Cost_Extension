<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0969da;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)" stroke="#0969da" stroke-width="3"/>
  
  <!-- Shield shape for security/protection -->
  <path d="M 64 25 L 40 40 L 40 70 Q 40 90 64 105 Q 88 90 88 70 L 88 40 Z" fill="#ffffff" opacity="0.9"/>
  
  <!-- Dollar symbol -->
  <text x="64" y="95" font-size="70" font-weight="bold" fill="#1f6feb" text-anchor="middle" font-family="Arial, sans-serif">$</text>
  
  <!-- Guard indicator - small checkmark on shield -->
  <path d="M 75 62 L 80 67 L 90 57" stroke="#1f6feb" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>